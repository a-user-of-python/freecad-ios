name: Build FreeCAD IPA

# Structure from day one (synthesis §5): a Stage-0 smoke job, then the
# two-job split — core libraries -> artifact -> workbenches + package —
# so a cold build never has to fit one 360-minute job. ccache is seeded
# by the first successful build and treated as infrastructure.
#
# HARD GATE: jobs core/workbench implement Stage 7, which must not run
# for real until spikes S3 (Python) and S4 (graphics) have reported.

on:
  workflow_dispatch:
    inputs:
      foundations_run_id:
        description: "Deps-Foundations run id (blank = no dep download)"
        required: false
        type: string
        default: ""
      occt_run_id:
        description: "Deps-OCCT run id (blank = no dep download)"
        required: false
        type: string
        default: ""
      python_run_id:
        description: "Deps-Python run id (blank = no dep download)"
        required: false
        type: string
        default: ""
      data_run_id:
        description: "Deps-Data run id (blank = no dep download)"
        required: false
        type: string
        default: ""
  push:
    paths:
      - "PIN.md"
      - "Scripts/**"
      - "Patches/**"
      - ".github/workflows/build-freecad.yml"

concurrency:
  group: build-freecad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: S0 toolchain smoke
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          df -h

      - name: Stage-0 smoke (Qt 6.9.3 dual-kit Widgets app)
        run: bash Scripts/build-stage0-smoke.sh

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: stage0-smoke-report
          path: dist-smoke/
          retention-days: 30
          if-no-files-found: warn

  core:
    name: FreeCAD core libraries
    runs-on: macos-26
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          for x in /Applications/Xcode_*.app; do
            [ "$x" = "/Applications/Xcode.app" ] || sudo rm -rf "$x"
          done 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          df -h

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: build-freecad-ccache-core-${{ hashFiles('PIN.md', 'Scripts/build-freecad.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-freecad-ccache-core-${{ hashFiles('PIN.md', 'Scripts/build-freecad.sh') }}-
            build-freecad-ccache-core-
            build-freecad-ccache-

      - name: Download foundations dep
        if: ${{ inputs.foundations_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-foundations-*
          run-id: ${{ inputs.foundations_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Download OCCT dep
        if: ${{ inputs.occt_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-occt-*
          run-id: ${{ inputs.occt_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Download Python dep
        if: ${{ inputs.python_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-python-*
          run-id: ${{ inputs.python_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Download data dep
        if: ${{ inputs.data_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-data-*
          run-id: ${{ inputs.data_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Assert one tarball per dep family
        if: ${{ inputs.foundations_run_id != '' || inputs.occt_run_id != '' || inputs.python_run_id != '' || inputs.data_run_id != '' }}
        run: |
          for fam in foundations occt python data; do
            n=$(ls ios-deps-artifacts/ 2>/dev/null | grep -c "iosdeps-$fam-" || true)
            if [ "$n" -gt 1 ]; then
              echo "ERROR: $n $fam tarballs staged - cross-generation mixing"
              ls ios-deps-artifacts/
              exit 1
            fi
          done
          ls -la ios-deps-artifacts/ || true

      - name: Build core libraries
        run: bash Scripts/build-freecad.sh core

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: freecad-core-${{ hashFiles('PIN.md', 'Scripts/build-freecad.sh') }}
          path: dist-core/
          retention-days: 30
          if-no-files-found: warn

  workbench:
    name: Workbenches + package IPA
    needs: core
    runs-on: macos-26
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          for x in /Applications/Xcode_*.app; do
            [ "$x" = "/Applications/Xcode.app" ] || sudo rm -rf "$x"
          done 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          df -h

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: build-freecad-ccache-workbench-${{ hashFiles('PIN.md', 'Scripts/build-freecad.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-freecad-ccache-workbench-${{ hashFiles('PIN.md', 'Scripts/build-freecad.sh') }}-
            build-freecad-ccache-workbench-
            build-freecad-ccache-core-
            build-freecad-ccache-

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: freecad-core-${{ hashFiles('PIN.md', 'Scripts/build-freecad.sh') }}
          path: dist-core-in

      - name: Download foundations dep
        if: ${{ inputs.foundations_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-foundations-*
          run-id: ${{ inputs.foundations_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Download OCCT dep
        if: ${{ inputs.occt_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-occt-*
          run-id: ${{ inputs.occt_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Download Python dep
        if: ${{ inputs.python_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-python-*
          run-id: ${{ inputs.python_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Download data dep
        if: ${{ inputs.data_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: iosdeps-data-*
          run-id: ${{ inputs.data_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ios-deps-artifacts

      - name: Assert one tarball per dep family
        if: ${{ inputs.foundations_run_id != '' || inputs.occt_run_id != '' || inputs.python_run_id != '' || inputs.data_run_id != '' }}
        run: |
          for fam in foundations occt python data; do
            n=$(ls ios-deps-artifacts/ 2>/dev/null | grep -c "iosdeps-$fam-" || true)
            if [ "$n" -gt 1 ]; then
              echo "ERROR: $n $fam tarballs staged - cross-generation mixing"
              ls ios-deps-artifacts/
              exit 1
            fi
          done
          ls -la ios-deps-artifacts/ || true

      - name: Build workbenches and package IPA
        run: bash Scripts/build-freecad.sh package

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeCAD-unsigned-SHELL
          path: FreeCAD-unsigned.ipa
          retention-days: 90
          if-no-files-found: warn
