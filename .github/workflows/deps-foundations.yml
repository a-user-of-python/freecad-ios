name: Deps — Foundations (S1)

on:
  workflow_dispatch:
  push:
    paths:
      - "PIN.md"
      - "Scripts/build-foundations.sh"
      - "Scripts/qt-install.inc.sh"
      - ".github/workflows/deps-foundations.yml"

concurrency:
  group: deps-foundations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: iosdeps-foundations tarball
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          # Sibling Xcode bundles are NOT deleted: deleting them destroyed
          # the iPhoneOS SDK mid-flight on some runners (Front 4 probe
          # finding, research/qt-gate-probe.md). SDK discovery is the
          # build scripts' job (filesystem scan across Xcode bundles).
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          df -h

      - name: Compute content hash
        run: echo "DEPS_HASH=${{ hashFiles('PIN.md', 'Scripts/build-foundations.sh', 'Scripts/qt-install.inc.sh') }}" >> "$GITHUB_ENV"

      - name: Build foundations (static, iOS arm64)
        run: bash Scripts/build-foundations.sh

      - name: Upload deps tarball
        uses: actions/upload-artifact@v4
        with:
          name: iosdeps-foundations-${{ env.DEPS_HASH }}
          path: dist/
          retention-days: 90
          if-no-files-found: warn
