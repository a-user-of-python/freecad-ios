name: Deps — Python 3.13 (S3 chain)

on:
  workflow_dispatch:
  push:
    paths:
      - "PIN.md"
      - "Scripts/build-python.sh"
      - ".github/workflows/deps-python.yml"

concurrency:
  group: deps-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: iosdeps-python tarball
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          for x in /Applications/Xcode_*.app; do
            [ "$x" = "/Applications/Xcode.app" ] || sudo rm -rf "$x"
          done 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          df -h

      - name: Compute content hash
        run: echo "DEPS_HASH=${{ hashFiles('PIN.md', 'Scripts/build-python.sh') }}" >> "$GITHUB_ENV"

      - name: Build Python 3.13 XCFramework (BeeWare route)
        run: bash Scripts/build-python.sh

      - name: Upload deps tarball
        uses: actions/upload-artifact@v4
        with:
          name: iosdeps-python-${{ env.DEPS_HASH }}
          path: dist/
          retention-days: 90
          if-no-files-found: warn
